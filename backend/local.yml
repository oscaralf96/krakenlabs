    nginx:
        restart: always
        depends_on:
            - api
        volumes:
            - static_volume:/app/staticfiles
            - media_volume:/app/mediafiles
        build:
            context: ./docker/local/nginx
            dockerfile: Dockerfile
        ports:
            - "8080:80"
        networks:
            - krakenlabs-api

networks:
    krakenlabs-api:
        driver: bridge

volumes:
    static_volume:
    media_volume:
    dev_postgres_data: {}
    dev_postgres_data_backups: {}
    flower_data: {}