    api:
        build:
            context: .
            dockerfile: ./docker/dev/django/Dockerfile
        command: /start
        volumes:
            - .:/app:z
            - static_volume:/app/staticfiles
            - media_volume:/app/mediafiles
        expose:
            - "8000"
        env_file:
            - ./.envs/.local/.django
            - ./.envs/.local/.postgres
        depends_on:
            - postgres
            # - mailhog
            # - redis
            # - es
        networks:
            - krakenlabs-api

    postgres:
        build:
            context: .
            dockerfile: ./docker/dev/postgres/Dockerfile
        volumes:
            - dev_postgres_data:/var/lib/postgresql/data
            - dev_postgres_data_backups:/backups
        env_file:
            - ./.envs/.dev/.postgres
        networks:
            - krakenlabs-api

    # mailhs-api

