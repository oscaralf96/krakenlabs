    krakenlabs_nginx:
        container_name: krakenlabs_nginx
        restart: always
        depends_on:
            - krakenlabs_api
        volumes:
            - static_volume:/app/staticfiles
            - media_volume:/app/mediafiles
            - ./certbot/www/:/var/www/certbot/:ro
        build:
            context: ./docker/dev/nginx
            dockerfile: Dockerfile
        ports:
            - "80:80"
            - "443:443"
        networks:
            - krakenlabs-api

networks:
    krakenlabs-api:
        driver: bridge

volumes:
    static_volume:
        name: krakenlabs_static_volume
    media_volume:
        name: krakenlabs_media_volume
    dev_postgres_data:
        name: krakenlabs_postgres_data
    dev_postgres_data_backups:
        name: krakenlabs_postgres_data_backups
    flower_data:
        name: krakenlabs_flower_data