    krakenlabs_certbot:
        image: certbot/certbot:latest
        volumes:
            - ./certbot/www/:/var/www/certbot/:rw
            - ./certbot/conf/:/etc/letsencrypt/:rw
        networks:
            - krakenlabs-api


    krakenlabs_api:
        container_name: krakenlabs_api
        build:
            context: .
            dockerfile: ./docker/dev/django/Dockerfile
        command: /start
        volumes:
            - .:/app:z
            - static_volume:/app/staticfiles
            - media_volume:/app/mediafiles
        expose:
            - "8000"
        env_file:
            - ./.envs/.dev/.django
            - ./.envs/.dev/.postgres
        depends_on:
            - krakenlabs_postgres
            # - mailhog
            # - redis
            # - es
        networks:
            - krakenlabs-api

    krakenlabs_postgres:
        container_name: krakenlabs_postgres
        build:
            context: .
            dockerfile: ./docker/dev/postgres/Dockerfile
        volumes:
            - dev_postgres_data:/var/lib/postgresql/data
            - dev_postgres_data_backups:/backups
        env_file:
            - ./.envs/.dev/.postgres
        networks:
            - krakenlabs-api

    # mailhs-api

