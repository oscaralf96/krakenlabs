server {

    listen 80;
    listen [::]:80;

    server_name krakenlabs.site *.krakenlabs.site;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
      return 301 https://dev.krakenlabs.site$request_uri;
    }

}

upstream krakenlabs_backend {
    server krakenlabs_api:8000;
}


upstream thebearproject_backend {
    server bearproject_api:8000;
}


server {
    listen 443 default_server ssl http2;
    listen [::]:443 ssl http2;

    client_max_body_size 20M;

    server_name krakenlabs.site *.krakenlabs.site;
    ssl_certificate /etc/nginx/ssl/live/dev.krakenlabs.site/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/dev.krakenlabs.site/privkey.pem;

    # Directly proxy all API v1 requests
    location /api/v1/ {
        proxy_pass http://krakenlabs_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Redirect exactly "/" to "/home" on the backend
    location = / {
        proxy_pass http://krakenlabs_backend/home/;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        add_header X-Proxy-Path "/home";
    }

    location / {
        proxy_pass http://krakenlabs_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Proxy to the API for /supersecret
    location /supersecret {
        proxy_pass http://krakenlabs_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Proxy to the API for /redoc
    location /redoc {
        proxy_pass http://krakenlabs_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Serve static files
    location /staticfiles/ {
        alias /app/staticfiles/;
    }

    # Serve media files
    location /mediafiles/ {
        alias /app/mediafiles/;
    }

}

server {

    listen 80;
    listen [::]:80;

    server_name thebearproject.site *.thebearproject.site;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
      return 301 https://dev.thebearproject.site$request_uri;
    }

}
