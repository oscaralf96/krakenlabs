server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name default.krakenlabs.site;

    ssl_certificate /etc/nginx/ssl/live/default.krakenlabs.site/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/default.krakenlabs.site/privkey.pem;

    location / {
        return 444;  # Close the connection if no match
    }
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        return 444;   # Close the connection without response
    }
}