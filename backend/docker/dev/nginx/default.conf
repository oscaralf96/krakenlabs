server {

    listen 80;
    listen [::]:80;

    server_name krakenlabs.site *.krakenlabs.site;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
      return 301 https://dev.krakenlabs.site$request_uri;
    }

}

upstream krakenlabs_backend {
    server krakenlabs_api:8000;
}


upstream thebearproject_backend {
    server bearproject_api:8000;
}


server {
    listen 443  ssl http2;
    listen [::]:443 ssl http2;

    client_max_body_size 20M;

    server_name dev.krakenlabs.site;
    ssl_certificate /etc/nginx/ssl/live/dev.krakenlabs.site/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/dev.krakenlabs.site/privkey.pem;

    # Directly proxy all API v1 requests
    location /api/v1/ {
        proxy_pass http://krakenlabs_backend;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-CSRFTOKEN "";
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Global CORS headers
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';

    }

    # Redirect exactly "/" to "/home" on the backend
    location = / {
        proxy_pass http://krakenlabs_backend/home/;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        add_header X-Proxy-Path "/home";
    }

    location / {
        proxy_pass http://krakenlabs_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Proxy to the API for /supersecret
    location /supersecret {
        proxy_pass http://krakenlabs_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Proxy to the API for /redoc
    location /redoc {
        proxy_pass http://krakenlabs_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Serve static files
    location /staticfiles/ {
        alias /app/staticfiles/;
    }

    # Serve media files
    location /mediafiles/ {
        alias /app/mediafiles/;
    }

}

